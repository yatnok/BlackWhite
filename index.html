<!DOCTYPE html>
<html>
<head>
    <title>Mastermind</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="title-bar">

        <h1>Please restart your workstation.</h1>

        <div class="tooltip">
        ⓘ
            <span class="tooltiptext">
                Guess the secret 4-digit code within 10 rounds.
                <br><br>
                ● = Correct number and position
                <br>
                ○ = Correct number but wrong position
                <br><br>
                Numbers 1-6 only.
                <br>
                No repeated numbers.
            </span>
        </div>

    </div>

    <p>Input 4 numbers in 1 to 6 to unlock.</p>

    <input type="text" id="guessInput" placeholder="Password">
    <button id="guessBtn">Enter</button>

    <div id="message"></div>

    <div id="history"></div>
     <button id="restartBtn" style="display:none;">
    ↻
    </button>
    <script src="script.js"></script>

</body>
</html>
